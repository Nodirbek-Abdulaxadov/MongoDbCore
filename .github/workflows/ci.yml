name: ci

on:
  push:
    branches: [ master, main, optimize ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore MongoDbCore.sln

      - name: Build (Release)
        run: dotnet build MongoDbCore.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/MongoDbCore.Tests/MongoDbCore.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'

      - name: Pack (Release)
        run: dotnet pack src/MongoDbCore/MongoDbCore.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.*nupkg
